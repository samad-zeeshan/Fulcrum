plan_id: valid_275_honours_conditional
description: >-
  A complete plan on the CMPUT 274/275 accelerated stream, all courses within the
  G2 scope.  Taking CMPUT 275 fires the gold conditional `note1_275_blocks_201`:
  CMPUT 201 becomes ineligible and `senior_choice` is rewritten to {229, 291}
  (+ any CMPUT >= 200).  This plan uses 229 + 291 for the choice group and never
  touches 201, so it must remain VALID with the conditional applied.  Also confirms
  274 + 275 together do NOT trip a credit exclusion (275's prereq IS 274), and that
  the bridge electives' prereqs are satisfied via 275 (e.g. 301/333 take 201-or-275).
expected: valid
